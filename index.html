<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lensy na karcie i w koszyku</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Pasek przełączników prototypu, poza stroną sklepu. Kolory i odstępy z Cyfrowe Design System:
   tekst #000, tło #f2f2f2, turkus #00b7d1 dla zaznaczenia, rogi kwadratowe, rytm 6/12/18. */
:root{--tlo:#f2f2f2;--tekst:#000;--szary:#525252;--linia:#c6c6c6;--turkus:#00b7d1}
*{box-sizing:border-box}
body{margin:0;background:var(--tlo);font:15px/1.5 Lato,Arial,sans-serif;color:var(--tekst)}
.pasek{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.12)}
.pasek-in{max-width:1512px;margin:0 auto;padding:12px 15px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.tytul{font-weight:700}
.grupa{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grupa>span{color:var(--szary);font-size:13px}
.grupa button{font:inherit;font-size:13px;background:#fff;color:var(--tekst);border:0;box-shadow:inset 0 0 0 1px var(--linia);padding:6px 12px;cursor:pointer}
.grupa button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--turkus);font-weight:700}
.ramka-wrap{display:flex;justify-content:center;padding:18px 15px 30px}
iframe{border:0;background:#fff;width:1512px;max-width:100%;height:calc(100vh - 110px);min-height:640px}
iframe.telefon{width:390px}
</style>
</head>
<body>
<div class="pasek"><div class="pasek-in">
  <span class="tytul">Lensy LensHero na karcie i w koszyku</span>
  <div class="grupa" role="group" aria-label="Strona sklepu"><span>Strona:</span>
    <button type="button" data-k="strona" data-v="karta">Karta produktu</button>
    <button type="button" data-k="strona" data-v="koszyk">Koszyk</button>
  </div>
  <div class="grupa" role="group" aria-label="Wersja testu"><span>Wersja testu:</span>
    <button type="button" data-k="wersja" data-v="A">A, bez zmian</button>
    <button type="button" data-k="wersja" data-v="B">B, z Lensami</button>
  </div>
  <div class="grupa" role="group" aria-label="Ekran"><span>Ekran:</span>
    <button type="button" data-k="ekran" data-v="komputer">Komputer</button>
    <button type="button" data-k="ekran" data-v="telefon">Telefon</button>
  </div>
  <div class="grupa"><button type="button" id="powtorz">Pokaż wejście wiersza</button></div>
</div></div>
<div class="ramka-wrap"><iframe id="ramka" title="Strona sklepu cyfrowe.pl"></iframe></div>
<script>
(function () {
  var WERSJA_PROTOTYPU = '2026-11-19-4';
  var s = { strona: 'karta', wersja: 'B', ekran: 'komputer' };
  try { location.hash.replace('#', '').split('&').forEach(function (p) { var kv = p.split('='); if (kv[0] in s && kv[1]) s[kv[0]] = kv[1]; }); } catch (e) {}
  var ramka = document.getElementById('ramka');
  function rysuj() {
    document.querySelectorAll('[data-k]').forEach(function (b) { b.setAttribute('aria-pressed', String(s[b.dataset.k] === b.dataset.v)); });
    ramka.className = s.ekran === 'telefon' ? 'telefon' : '';
    /* Numer wersji w adresie: przeglądarka nie weźmie starej strony z pamięci (GitHub Pages trzyma ją do 10 minut). */
    ramka.src = s.strona + '.html?v=' + WERSJA_PROTOTYPU + '-' + Date.now() + '#wersja=' + s.wersja;
    history.replaceState(null, '', '#strona=' + s.strona + '&wersja=' + s.wersja + '&ekran=' + s.ekran);
  }
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-k]'); if (!b) return; s[b.dataset.k] = b.dataset.v; rysuj(); });
  /* Wiersz LensHero wjeżdża przy wczytaniu strony. Przycisk wczytuje ją jeszcze raz w wersji B. */
  document.getElementById('powtorz').addEventListener('click', function () { s.wersja = 'B'; rysuj(); });
  rysuj();
})();
</script>
</body></html>
